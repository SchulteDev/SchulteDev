name: Update CVs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      api_model:
        description: 'Claude Model'
        required: true
        default: 'claude-sonnet-5-5'
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # having "changes" job instead of GitHub action paths filtering for being usable as pull request check
  changes:
    runs-on: ubuntu-latest
    # This job is skipped for workflow_dispatch.
    #   In GitHub actions, follow up jobs have do use "always()" plus other conditions because of this.
    #   See https://github.com/actions/runner/issues/2205 for details.
    if: github.event_name != 'workflow_dispatch'
    outputs:
      scripts: ${{ steps.changed-files.outputs.scripts_any_changed }}
      career: ${{ steps.changed-files.outputs.career_any_changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files_yaml: |
            scripts:
              - .github/workflows/update-cvs.yml
              - curriculum_vitae/scripts/**
            career:
              - _data/career.md

  test_cv_scripts:
    runs-on: ubuntu-latest
    environment: Sonar_SchulteDev_SchulteDev:curriculum_vitae_scripts
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.career == 'true')
    defaults:
      run:
        working-directory: curriculum_vitae/scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: 'curriculum_vitae/scripts/package-lock.json'
          node-version-file: 'curriculum_vitae/scripts/.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:coverage
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Unit Tests
          path: curriculum_vitae/scripts/test-results.xml
          reporter: java-junit
          fail-on-error: true
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: curriculum_vitae/scripts/test-results.xml
          retention-days: 7
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: curriculum_vitae/scripts/lcov.info
          retention-days: 7
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          projectBaseDir: curriculum_vitae/scripts/
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Smoke test CV update without the API
        env:
          SKIP_API: true
        run: npm run cv:update
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: curriculum_vitae/scripts/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  update-cvs:
    runs-on: ubuntu-latest
    needs: [changes, test_cv_scripts]
    if: >-
      always() && needs.test_cv_scripts.result == 'success' && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref_name == 'main' && needs.changes.outputs.career == 'true'))
    strategy:
      fail-fast: false
      matrix:
        cv_type: [ anti, professional ]
    defaults:
      run:
        working-directory: curriculum_vitae/scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: 'curriculum_vitae/scripts/package-lock.json'
          node-version-file: 'curriculum_vitae/scripts/.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Update CV
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_MODEL: ${{ inputs.api_model }}
          CV_TYPES: ${{ matrix.cv_type }}
        run: npm run cv:update
      - name: Validate LaTeX (compilation test)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ github.workspace }}/curriculum_vitae/markus-schulte-dev-${{ matrix.cv_type }}-cv.tex
          args: -lualatex -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Check the PDF against PDF/UA-1
        uses: docker://verapdf/cli:v1.30.4
        continue-on-error: true
        with:
          args: --flavour ua1 --format text --verbose markus-schulte-dev-${{ matrix.cv_type }}-cv.pdf
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cv_type }}-cv-pdf
          path: markus-schulte-dev-${{ matrix.cv_type }}-cv.pdf
          retention-days: 7
      - name: Upload updated .tex file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cv_type }}-tex-file
          path: curriculum_vitae/markus-schulte-dev-${{ matrix.cv_type }}-cv.tex
          retention-days: 7
      - name: Upload Claude response log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cv-update-logs-${{ matrix.cv_type }}-${{ github.run_id }}
          path: curriculum_vitae/scripts/tmp/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check the page count
        working-directory: ${{ github.workspace }}
        run: |
          pages=$(tr -d '\n' < markus-schulte-dev-${{ matrix.cv_type }}-cv.log | sed -n 's/.*Output written on [^(]*(\([0-9]*\) page.*/\1/p')
          echo "${{ matrix.cv_type }} CV: ${pages:-unknown} pages"
          [ "$pages" = 4 ] || { echo "::error::The ${{ matrix.cv_type }} CV has ${pages:-an unknown number of} pages instead of 4"; exit 1; }

  commit-changes:
    needs: update-cvs
    if: always() && needs.update-cvs.result == 'success' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SCHULTEDEV_UPDATE_CVS_PAT }}
      - name: Download updated anti CV .tex file
        uses: actions/download-artifact@v8
        with:
          name: anti-tex-file
          path: curriculum_vitae/
      - name: Download updated professional CV .tex file
        uses: actions/download-artifact@v8
        with:
          name: professional-tex-file
          path: curriculum_vitae/
      - name: Commit updated LaTeX files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix(cv): Update CVs"
          file_pattern: "curriculum_vitae/markus-schulte-dev-*.tex"
