sonar.projectKey=SchulteDev_SchulteDev:curriculum_vitae_scripts
sonar.projectName=CV Generation Scripts
sonar.organization=schultedev
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,tmp/**,test-results.xml,*.config.ts,**/*.test.ts,package-lock.json
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts
sonar.typescript.lcov.reportPaths=./coverage/lcov.info
sonar.junit.reportPaths=./test-results.xml

# processAllCvTypes() in transform-utils.ts calls the Claude API once per CV
# type, one after the other on purpose: it keeps the per-type log output
# readable and avoids parallel long-running requests against the API rate
# limit. In CI each matrix job processes a single CV type anyway, so there is
# nothing to gain from Promise.all here.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e1.resourceKey=transform-utils.ts
