title: Schulte development
author: Markus Schulte
email: mail@schulte-development.de
avatar: assets/img/markus-schulte.jpg
url: "http://localhost:4000"
description: "Cloud Architect & Staff Software Engineer specializing in Azure, AWS, Java, and Golang"
keywords: "Cloud Architect, Staff Software Engineer, Self-contained Systems, Cloud-Native, Technical Leader, Azure, AWS, Java, Golang"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Build and repo tooling has no business being served to visitors. Setting this
# key replaces Jekyll's built-in list, so the defaults are repeated here.
exclude:
  # Jekyll defaults
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # This site's tooling
  - Dockerfile
  - Makefile
  - README.md
  - Rakefile
  - assets/vendor/README.md
  - docker-compose.yml
  - sonar-project.properties
  - tools/
remote_theme: daattali/beautiful-jekyll
navbar-links:
  About Me: "/#about-me"
  Skills: "/#my-skillset"
  Career: "/#my-career"
  Services: "/#my-services"
  Contributions: "/#my-contributions"
  Connect: "/#lets-connect"
  Imprint: "/imprint"
  Privacy: "/privacy"
social-network-links:
  email: mail@schulte-development.de
  linkedin: markus-schulte
  github: SchulteDev
  stackoverflow: 1645517
