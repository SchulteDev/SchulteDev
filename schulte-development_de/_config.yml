title: Schulte development
author: Markus Schulte
email: mail@schulte-development.de
avatar: assets/img/markus-schulte.jpg
url: "http://localhost:4000"
keywords: "Cloud Architect, Software Engineer, IT Architect, Self-contained Systems, Cloud-Native, Technical Leader, Agentic Coding, Azure, AWS, Java, Golang, Freelancer"
cv_url: "https://github.com/SchulteDev/SchulteDev/releases/latest/download/markus-schulte-dev-professional-cv.pdf"
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# Tooling stays out of _site. Jekyll adds its own defaults; patterns are anchored at the source root.
exclude:
  - Containerfile
  - Makefile
  - README.md
  - Rakefile
  - assets/vendor/README.md
  - sonar-project.properties
  - tools/
# Pinned: re-check _layouts/base.html against upstream before bumping.
remote_theme: daattali/beautiful-jekyll@7286eb8478fbd4265a6d2497c2e0f84d9a9326ba
navbar-links:
  About Me: "/#about-me"
  Skills: "/#my-skillset"
  Career: "/#my-career"
  Services: "/#my-services"
  Contributions: "/#my-contributions"
  Connect: "/#lets-connect"
  Imprint: "/imprint"
  Privacy: "/privacy"
social-network-links:
  email: mail@schulte-development.de
  linkedin: markus-schulte
  github: SchulteDev
  stackoverflow: 1645517
defaults:
  - scope:
      path: ""
    values:
      css: /assets/main.css
      share-description: "Markus Schulte, freelance Cloud Architect & Software Engineer in Cologne: hands-on enterprise modernization in regulated environments (banking, asset management) with Azure, AWS and agent-first delivery."
  - scope:
      path: "companies"
    values:
      layout: company
      back: "/#my-career"
