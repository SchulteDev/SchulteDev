title: Schulte development
author: Markus Schulte
email: mail@schulte-development.de
avatar: assets/img/markus-schulte.jpg
url: "http://localhost:4000"
description: "Cloud Architect & Staff Software Engineer specializing in Azure, AWS, Java, and Golang"
keywords: "Cloud Architect, Staff Software Engineer, Self-contained Systems, Cloud-Native, Technical Leader, Azure, AWS, Java, Golang"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Build and repo tooling has no business being served to visitors: Jekyll copies
# any file without front matter straight into _site. Jekyll appends its own
# defaults (Gemfile, Gemfile.lock, node_modules, vendor/bundle/, ...) to this
# list rather than being replaced by it, so only site-specific entries belong
# here. Patterns are anchored at the source root, which is why the nested
# assets/vendor/README.md needs its own entry.
exclude:
  - Dockerfile
  - Makefile
  - README.md
  - Rakefile
  - assets/vendor/README.md
  - docker-compose.yml
  - sonar-project.properties
  - tools/
remote_theme: daattali/beautiful-jekyll
navbar-links:
  About Me: "/#about-me"
  Skills: "/#my-skillset"
  Career: "/#my-career"
  Services: "/#my-services"
  Contributions: "/#my-contributions"
  Connect: "/#lets-connect"
  Imprint: "/imprint"
  Privacy: "/privacy"
social-network-links:
  email: mail@schulte-development.de
  linkedin: markus-schulte
  github: SchulteDev
  stackoverflow: 1645517
