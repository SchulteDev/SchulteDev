---
layout: page
---

<article class="subpage">
{{ content }}
</article>

{% if page.back %}
  {% assign back_label = "home" %}
  {% for link in site.navbar-links %}
    {% if link[1] == page.back %}{% assign back_label = link[0] %}{% endif %}
  {% endfor %}
  <p class="subpage-back">
    <a href="{{ page.back | relative_url }}" class="cta-button secondary">&larr; Back to {{ back_label }}</a>
  </p>
{% endif %}
