sonar.projectKey=SchulteDev_SchulteDev:schulte-development_de
sonar.projectName=Professional Website
sonar.organization=schultedev
sonar.sources=.

# assets/vendor/** is third-party code vendored verbatim (Bootstrap, jQuery,
# Popper, Font Awesome, Google Fonts) so that no visitor IP reaches a CDN.
# It is deliberately not ours to change -- analysing it reports on upstream's
# minified output, and any finding there is unactionable short of dropping the
# self-hosting. See assets/vendor/README.md.
sonar.exclusions=.jekyll-cache/**,_site/**,.jekyll-metadata,Gemfile.lock,assets/vendor/**

# This site has no unit-test framework: it is validated end to end by
# `make validate` (jekyll doctor, the checks in Rakefile, and html-proofer over
# the built site). Measuring line coverage on the Rakefile that *is* the test
# suite, and on a one-shot vendoring script, only ever yields 0%.
sonar.coverage.exclusions=Rakefile,tools/**

# Force analysis of markdown files
sonar.lang.patterns.web=**/*.html,**/*.md

# _layouts/*.html are Jekyll layout fragments, not pages: <head> arrives via
# {% include head.html %}, which the HTML analyser cannot follow, so it reports
# every layout as a page missing a <title>.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=_layouts/**
