sonar.projectKey=SchulteDev_SchulteDev:schulte-development_de
sonar.projectName=Professional Website
sonar.organization=schultedev
sonar.sources=.

# assets/vendor/** is third-party code, vendored verbatim.
sonar.exclusions=.jekyll-cache/**,_site/**,.jekyll-metadata,Gemfile.lock,assets/vendor/**

# No unit tests: `make validate` checks the built site; the Rakefile is the test suite.
sonar.coverage.exclusions=Rakefile,tools/**

# Force analysis of markdown files
sonar.lang.patterns.web=**/*.html,**/*.md

# Layouts get <head> via an include the HTML analyser can't follow.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=_layouts/**
